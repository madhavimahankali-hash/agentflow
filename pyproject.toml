[project]
name = "agentflow"
version = "1.0.0"
description = "Multi-agent workflow automation: LangGraph supervisor, specialist agents, human approval, execution history"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Madhavi Mahankali" }]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".venv-*", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::ResourceWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*"]
